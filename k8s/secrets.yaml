apiVersion: v1
kind: Secret
metadata:
  name: confetti-secrets
  namespace: confetti
type: Opaque
stringData:
  # Database URLs (replace with actual DigitalOcean managed database URLs)
  MONGODB_URI: "mongodb+srv://username:password@cluster.mongodb.net/confetti"
  POSTGRES_URI: "postgresql://username:password@host:port/confetti"
  REDIS_URL: "rediss://username:password@host:port"

  # JWT Secrets (GENERATE NEW ONES!)
  JWT_ACCESS_SECRET: "your-super-secure-jwt-access-secret-here-change-this"
  JWT_REFRESH_SECRET: "your-super-secure-jwt-refresh-secret-here-change-this"
  SESSION_SECRET: "your-super-secure-session-secret-here-change-this"

  # Email Configuration
  SMTP_USER: "your-production-email@yourdomain.com"
  SMTP_PASSWORD: "your-production-email-password"
  FROM_EMAIL: "your-production-email@yourdomain.com"

  # API Keys
  OPENAI_API_KEY: "your-production-openai-api-key"

  # Payment Gateway Keys
  FLUTTERWAVE_PUBLIC_KEY: "your-production-flutterwave-public-key"
  FLUTTERWAVE_SECRET_KEY: "your-production-flutterwave-secret-key"
  FLUTTERWAVE_ENCRYPTION_KEY: "your-production-flutterwave-encryption-key"
  FLUTTERWAVE_WEBHOOK_SECRET: "your-production-webhook-secret"
  FLUTTERWAVE_WEBHOOK: "https://your-domain.com/api/v1/webhooks/flutterwave"

  PAYSTACK_PUBLIC_KEY: "your-production-paystack-public-key"
  PAYSTACK_SECRET_KEY: "your-production-paystack-secret-key"
  PAYSTACK_WEBHOOK_SECRET: "your-production-paystack-webhook-secret"

  # Cloudinary
  CLOUDINARY_CLOUD_NAME: "your-cloudinary-cloud-name"
  CLOUDINARY_API_KEY: "your-cloudinary-api-key"
  CLOUDINARY_API_SECRET: "your-cloudinary-api-secret"
