# Render Blueprint — Confetti (API + AI service + web frontend)
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render prompts
# for every `sync: false` value. Full steps: docs/deploy-render.md
#
# Free tier notes (see the guide for the upgrade path):
# - Free web services sleep after 15 min idle; the first request then takes
#   ~1 min. Background jobs (email queue, reminders) pause while asleep.
# - The AI service is a public web service here because free services can't
#   receive private-network traffic. Every endpoint except /health/ai requires
#   PYTHON_API_KEY, which only the API knows. On a paid plan, switch it to
#   `type: pserv` and point PYTHON_API_URL at its internal address.
# - No persistent disk on free: files written locally (backups, the email
#   retry queue) are lost on redeploy. Backups are disabled below.
# - Redis: uses an existing Key Value instance (REDIS_URL prompt) because the
#   free tier allows one per workspace. It must be in the same region as
#   these services (oregon) for its Internal URL to work.
# - Service URLs assume these names are free on onrender.com. If Render gives
#   a service a different URL (e.g. with a suffix), update FRONTEND_URL,
#   PYTHON_API_URL and NEXT_PUBLIC_API_URL to match, then redeploy.

services:
  # ---------------------------------------------------------------------------
  # Node.js API — https://confetti-api.onrender.com
  # ---------------------------------------------------------------------------
  - type: web
    name: confetti-api
    runtime: node
    plan: free
    region: oregon
    branch: apidev
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - src/node/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production

      # Cross-service URLs (public onrender.com addresses)
      - key: FRONTEND_URL
        value: https://confetti-web.onrender.com
      - key: PYTHON_API_URL
        value: https://confetti-ai.onrender.com
      - key: PYTHON_API_KEY
        fromService:
          type: web
          name: confetti-ai
          envVarKey: PYTHON_API_KEY
      # Payment callbacks use RENDER_EXTERNAL_URL (set by Render) unless
      # PUBLIC_URL is set. Never set PUBLIC_NGROK_URL here.

      # Frontend and API are different sites on onrender.com, so auth cookies
      # must be SameSite=None (CSRF is blocked by the origin guard)
      - key: COOKIE_SAMESITE
        value: none

      # Database and cache
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      # Existing Key Value instance (free tier allows one per workspace).
      # Use its Internal URL with a database number, e.g.
      # redis://red-xxxxxxxx:6379/1 — see docs/deploy-render.md
      - key: REDIS_URL
        sync: false

      # Auth and encryption
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DOCUMENT_SHARE_SECRET
        generateValue: true
      # Encrypts stored integration secrets: never change it after first deploy
      - key: SECRETS_ENCRYPTION_KEY
        generateValue: true

      # First super admin, created at startup if no admin exists
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false

      # Email (SMTP with STARTTLS)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false # must be an email address
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: Confetti

      # Payments
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_ENCRYPTION_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false

      # File storage (images, documents)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Escrow: booking payments are released this many days after the event.
      # Payouts: "manual" (admins pay vendors and mark them paid) until Paystack
      # Transfers are enabled on the account, then set to "paystack".
      - key: ESCROW_AUTO_RELEASE_DAYS
        value: "3"
      - key: ESCROW_PAYOUTS
        value: manual
      # Featured listing spots per category at any one time
      - key: FEATURED_SLOTS_PER_CATEGORY
        value: "6"
      # Venue plan: default hold length (days)
      - key: VENUE_HOLD_DAYS
        value: "3"
      # Diaspora payments: naira per USD/GBP (keep these current) and a margin for conversion costs
      - key: FX_NGN_PER_USD
        value: "1600"
      - key: FX_NGN_PER_GBP
        value: "2050"
      - key: FX_BUFFER
        value: "0.02"
      # Video calls: private Daily.co rooms with a personal link per person (recommended;
      # free tier at daily.co). Without a key, calls fall back to Jitsi Meet, where the
      # first person in the call has to sign in.
      - key: DAILY_API_KEY
        sync: false
      - key: JITSI_BASE_URL
        value: https://meet.jit.si
      # Corporate invoices: VAT, Confetti's details and the account for bank transfers
      - key: CORPORATE_VAT_RATE
        value: "0.075"
      - key: CONFETTI_LEGAL_NAME
        sync: false
      - key: CONFETTI_RC_NUMBER
        sync: false
      - key: CONFETTI_VAT_NUMBER
        sync: false
      - key: CORPORATE_BANK_NAME
        sync: false
      - key: CORPORATE_ACCOUNT_NAME
        sync: false
      - key: CORPORATE_ACCOUNT_NUMBER
        sync: false

      # Nothing persists on free-tier disks; enable with a Persistent Disk
      - key: BACKUP_ENABLED
        value: "false"

  # ---------------------------------------------------------------------------
  # Python AI service — https://confetti-ai.onrender.com
  # ---------------------------------------------------------------------------
  - type: web
    name: confetti-ai
    runtime: docker
    plan: free
    region: oregon
    branch: apidev
    dockerfilePath: ./src/python/Dockerfile
    dockerContext: ./src/python
    healthCheckPath: /health/ai
    autoDeploy: true
    buildFilter:
      paths:
        - src/python/**
    envVars:
      # gunicorn in the Dockerfile binds 5600; tell Render to route there
      - key: PORT
        value: "5600"
      - key: FLASK_ENV
        value: production
      # Shared secret; the API reads it from here (fromService above)
      - key: PYTHON_API_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false # same Atlas connection string as the API
      - key: REDIS_URL
        sync: false # same value as confetti-api
      # At least one AI provider; without any, AI features fall back to local
      # scoring and report "degraded" on /health/ai
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Next.js frontend — https://confetti-web.onrender.com (separate repo)
  # ---------------------------------------------------------------------------
  - type: web
    name: confetti-web
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/josat57/confetti_
    branch: develop
    # Don't set NODE_ENV: npm ci needs devDependencies to build;
    # `next start` runs in production mode on its own
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # NEXT_PUBLIC_* values are baked in at build time: redeploy after changing
      - key: NEXT_PUBLIC_API_URL
        value: https://confetti-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: NEXT_PUBLIC_FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
