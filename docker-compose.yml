services:
  # Node.js API Service
  node-api:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "9601:9600"
    env_file:
      - .env
    environment:
      # Docker-network overrides — these take precedence over .env
      PORT: 9600
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/confetti
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_API_URL: http://python-api:5600
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./src/node:/usr/src/app/src/node
      - node_modules:/usr/src/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: confetti-node-api
    networks:
      - confetti-network
    restart: unless-stopped

  # Python AI/ML Service
  python-api:
    build:
      context: ./src/python
      dockerfile: Dockerfile
    ports:
      - "5600:5600"
    env_file:
      - .env
    environment:
      # Docker-network overrides
      FLASK_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/confetti
      REDIS_URI: redis://redis:6379
    volumes:
      - ./src/python:/usr/src/app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: confetti-python-api
    networks:
      - confetti-network
    restart: unless-stopped

  # MongoDB Service
  mongodb:
    image: mongo:8
    container_name: confetti-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_DATABASE: confetti
    networks:
      - confetti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # PostgreSQL Service
  postgres:
    image: postgres:16-alpine
    container_name: confetti-postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: confetti
    networks:
      - confetti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: confetti-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - confetti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongodb_data:
  redis_data:
  postgres_data:
  node_modules:

networks:
  confetti-network:
    driver: bridge
