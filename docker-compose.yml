version: '3.8'

services:
  # Node.js API Service
  node-api:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "9600:9600"
    volumes:
      - ./src/node:/usr/src/app/src/node
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      - PORT=${PORT:-9600}
      - NODE_ENV=development
      - MONGODB_URI=mongodb://confetti:Ginger_123@confetti-mongodb:27017/confetti?authSource=admin
      - REDIS_URL=redis://confetti-redis:6379
      - POSTGRES_URI=${POSTGRES_URI}
      - PYTHON_API_URL=${PYTHON_API_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - FACEBOOK_CALLBACK_URL=${FACEBOOK_CALLBACK_URL}
      - TWITTER_CONSUMER_KEY=${TWITTER_CONSUMER_KEY}
      - TWITTER_CONSUMER_SECRET=${TWITTER_CONSUMER_SECRET}
      - TWITTER_CALLBACK_URL=${TWITTER_CALLBACK_URL}
    depends_on:
      - mongodb
      - postgres
      - redis
    container_name: confetti-node-api
    networks:
      - confetti-network

  # Python AI/ML Service
  python-api:
    build:
      context: ./src/python
      dockerfile: Dockerfile
    ports:
      - "5600:5600"
    volumes:
      - ./src/python:/usr/src/app/src/python
    environment:
      - FLASK_ENV=development
      - MONGODB_URI=mongodb://confetti:Ginger_123@confetti-mongodb:27017/confetti?authSource=admin
      - REDIS_URI=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    container_name: confetti-python-api
    networks:
      - confetti-network

  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: confetti-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_DATABASE=confetti
    networks:
      - confetti-network

  # PostgreSQL Service
  postgres:
    image: postgres:latest
    container_name: confetti-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=confetti
    networks:
      - confetti-network

  # Redis Service
  redis:
    image: redis:latest
    container_name: confetti-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - confetti-network

volumes:
  mongodb_data:
  postgres_data:
  redis_data:

networks:
  confetti-network:
    driver: bridge 